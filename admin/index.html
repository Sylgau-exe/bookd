<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BOOKD Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2315161B'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-style='italic' text-anchor='middle' fill='%23FF5A7E'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
window.onerror = function (m, s, l) { console.error('Admin error:', m, s, l); var b = document.getElementById('toast'); if (b) { b.textContent = 'Something went wrong. Reload the page.'; b.hidden = false; } return false; };
window.onunhandledrejection = function (e) { console.error('Admin promise:', e.reason); };
</script>
<style>
/* Layout: a quiet back office — sidebar navigation, a pipeline strip on top, dense tables and two-column order sheets. Brand accent only for status and actions. */
:root{--bg:#F4F5F7;--surface:#FFFFFF;--ink:#15161B;--muted:#5B5E68;--rule:#E1E3E8;--accent:#B0123B;--accent-soft:rgba(176,18,59,.08);--on-accent:#fff;
--good:#1F7A4D;--good-soft:rgba(31,122,77,.1);--warn:#A15C00;--warn-soft:rgba(161,92,0,.1);
--display:"Bodoni Moda",Georgia,serif;--body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101115;--surface:#191B21;--ink:#ECEDF1;--muted:#A3A6B0;--rule:#2B2E37;--accent:#FF5A7E;--accent-soft:rgba(255,90,126,.12);--on-accent:#1A0710;--good:#4FCB8C;--good-soft:rgba(79,203,140,.12);--warn:#F0B35A;--warn-soft:rgba(240,179,90,.12);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mark{font-family:var(--display);font-size:1.5rem;font-weight:600;letter-spacing:.06em}
.mark i{color:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--rule);border-radius:7px;padding:8px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label{display:grid;gap:4px;font-size:.78rem;color:var(--muted)}
label.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink)}
label.chk input{width:auto}
/* shell */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--rule);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.side nav{display:grid;gap:2px}
.side nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--muted)}
.side nav a.on{background:var(--bg);color:var(--ink);font-weight:600}
.side .who{margin-top:auto;font-size:.8rem;color:var(--muted);display:grid;gap:6px}
.badge{font-family:var(--mono);font-size:.7rem;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 7px}
main{padding:26px clamp(16px,3vw,36px);min-width:0}
.top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side nav{grid-auto-flow:column}.side .who{margin:0}.grid2,.grid3{grid-template-columns:1fr}}
/* pipeline */
.pipe{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pipe button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.82rem;display:flex;gap:6px;align-items:center}
.pipe button b{font-family:var(--mono);font-weight:500}
.pipe button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;font-size:.74rem;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--rule);white-space:nowrap}
.pill.s-new,.pill.s-changes{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.s-approved,.pill.s-paid,.pill.s-shipped,.pill.s-delivered{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill.s-proof_sent,.pill.s-layout,.pill.s-printing{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.s-cancelled{opacity:.6}
.cvb{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:5px;white-space:nowrap;vertical-align:middle}
.cvb.hard{background:#15161B;color:#fff}.cvb.soft{background:#fff;color:#15161B;border:1.5px solid #15161B}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--rule)}
.tbl td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--bg)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* order sheet */
.sheet{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.sheet{grid-template-columns:1fr}}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.th{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:4/5;background:var(--bg);border:1px solid var(--rule)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.off img{opacity:.3}
.th .tag{position:absolute;left:4px;top:4px;font-family:var(--mono);font-size:.62rem;padding:1px 5px;border-radius:4px;background:var(--warn);color:#fff}
.th .tag.cv{background:var(--accent);left:auto;right:4px}
.th .ops{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:14px 4px 4px}
.th .ops button{background:none;border:0;color:#fff;font-size:.72rem;font-weight:600;cursor:pointer;padding:2px 4px;white-space:nowrap}
.shoot-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:14px 0 8px}
.shoot-h:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.events{display:grid;gap:8px;font-size:.85rem;max-height:340px;overflow:auto}
.events div{display:grid;grid-template-columns:auto 1fr;gap:10px}
.events time{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap;padding-top:2px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.88rem}
.proof{border:1px solid var(--rule);border-radius:8px;padding:12px;display:grid;gap:8px}
.comment{font-size:.88rem;padding:8px 10px;background:var(--bg);border-radius:7px;display:flex;justify-content:space-between;gap:10px}
.comment.done{opacity:.55}
.copy{display:flex;gap:6px}.copy input{font-family:var(--mono);font-size:.78rem}
/* auth + dialog + toast */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth .card{width:min(400px,100%);display:grid;gap:14px}
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);padding:22px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50}
.muted{color:var(--muted)}.small{font-size:.82rem}.mono{font-family:var(--mono)}
.msg-body{white-space:pre-wrap;max-width:520px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.designs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.design{border:2px solid var(--rule);border-radius:12px;padding:8px;background:none;cursor:pointer;text-align:left;font:inherit;color:inherit}
.design.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft, rgba(176,18,59,.12))}
.design .mini{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:17/11;border-radius:6px;overflow:hidden;margin-bottom:8px;box-shadow:0 6px 16px -10px rgba(0,0,0,.5)}
.design .mini .tp{padding:10% 9%;display:flex;flex-direction:column;gap:4px;container-type:inline-size}
.design .mini .n{font-size:30cqw;line-height:.9}
.design .mini .t{font-size:11cqw;line-height:1.1}
.design .mini .l{height:2px;width:70%;opacity:.35;margin-top:2px}
.design .mini .ph{background-size:cover;background-position:center;background-color:#ccc}
.design b{display:block;font-size:.95rem}
.design span{display:block;font-size:.78rem;color:var(--muted);margin-top:2px;line-height:1.35}
</style>
</head>
<body>
<div id="toast" hidden></div>

<!-- login / first-time setup -->
<section class="auth" id="auth" hidden>
  <form class="card" id="auth-form">
    <div><span class="mark">BOOK<i>D</i></span> <span class="eyebrow">Admin</span></div>
    <h2>Sign in</h2>
    <label>Email<input id="f-email" type="email" autocomplete="username" required></label>
    <label>Password<input id="f-pass" type="password" autocomplete="current-password" required></label>
    <p class="muted small" id="auth-hint" hidden>First time? Use your email and the password you set as ADMIN_SETUP_KEY in Vercel.</p>
    <div class="warnbox" id="auth-err" hidden></div>
    <button class="btn primary" type="submit" id="auth-btn">Sign in</button>
  </form>
</section>

<div class="shell" id="app" hidden>
  <aside class="side">
    <div><span class="mark">BOOK<i>D</i></span><div class="eyebrow">Back office</div></div>
    <nav>
      <a href="#orders" data-nav="orders">Orders</a>
      <a href="#messages" data-nav="messages">Messages <span class="badge" id="unread" hidden></span></a>
      <a href="#team" data-nav="team">Team</a>
      <a href="/" target="_blank" rel="noopener">Public site ↗</a>
    </nav>
    <div class="who"><span id="who"></span><button class="btn ghost small" id="logout" type="button">Sign out</button></div>
  </aside>
  <main id="view"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlg-form" class="stack"></form></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = v => v == null || v === '' ? '—' : '$' + Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' USD';
const when = d => d ? new Date(d).toLocaleString('en-CA', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
let TOKEN = null; try { TOKEN = localStorage.getItem('bookd_admin'); } catch {}
let META = { statuses: [], packages: {} };
const statusLabel = k => (META.statuses.find(s => s[0] === k) || [k, k])[1];
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
async function api(action, { method = 'GET', body, query = '' } = {}) {
  const r = await fetch(`/api/admin/${action}${query ? '?' + query : ''}`, { method, headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && !['login', 'setup'].includes(action)) { signOut(); throw new Error('Please sign in again'); }
  if (!r.ok || j.ok === false) throw new Error(j.error || 'Request failed (' + r.status + ')');
  return j;
}
const post = (a, body) => api(a, { method: 'POST', body });
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch { prompt('Copy this:', t); } }

/* ---------- auth ---------- */
async function showAuth() {
  $('#app').hidden = true; $('#auth').hidden = false;
  try { const s = await api('setup'); $('#auth-hint').hidden = !s.needsSetup; } catch (e) { $('#auth-err').textContent = e.message; $('#auth-err').hidden = false; }
}
$('#auth-form').addEventListener('submit', async e => {
  e.preventDefault(); $('#auth-err').hidden = true;
  try {
    const r = await post('login', { email: $('#f-email').value.trim(), password: $('#f-pass').value });
    TOKEN = r.token; try { localStorage.setItem('bookd_admin', TOKEN); } catch {}
    start();
  } catch (err) { $('#auth-err').textContent = err.message; $('#auth-err').hidden = false; }
});
function signOut() { TOKEN = null; try { localStorage.removeItem('bookd_admin'); } catch {} showAuth(); }
$('#logout').onclick = signOut;

async function start() {
  if (!TOKEN) return showAuth();
  try { META = await api('me'); } catch { return; }
  $('#auth').hidden = true; $('#app').hidden = false;
  $('#who').textContent = META.admin.name || META.admin.email;
  route(); refreshUnread();
}
async function refreshUnread() { try { const d = await api('dashboard'); const u = $('#unread'); u.textContent = d.unread; u.hidden = !d.unread; } catch {} }
window.addEventListener('hashchange', route);
function route() {
  const h = location.hash.slice(1) || 'orders';
  const [view, id] = h.split('/');
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === (view === 'order' ? 'orders' : view)));
  if (view === 'order' && id) return viewOrder(+id);
  if (view === 'messages') return viewMessages();
  if (view === 'team') return viewTeam();
  return viewOrders();
}

/* ---------- dialog helper ---------- */
function openDialog(html, onSubmit, okLabel = 'Save') {
  const d = $('#dlg'), f = $('#dlg-form');
  f.innerHTML = html + `<div class="warnbox" id="dlg-err" hidden></div><div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok" id="dlg-ok">${esc(okLabel)}</button></div>`;
  f.onsubmit = async e => {
    if (e.submitter && e.submitter.value === 'cancel') return;
    e.preventDefault();
    try { await onSubmit(new FormData(f)); d.close(); } catch (err) { $('#dlg-err').textContent = err.message; $('#dlg-err').hidden = false; }
  };
  d.showModal();
}
function pkgOptions(sel) { return Object.entries(META.packages).map(([k, p]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${p.label} — ${p.pages} pages, ${p.maxPhotos} photos · soft $${p.price} / hard $${p.price + (META.hardSurcharge || 20)}</option>`).join(''); }
// v1.26 — the binding the CUSTOMER chose (drives the proof, the cover size and the Lulu product)
const cvBadge = (c) => `<span class="cvb ${c === 'hard' ? 'hard' : 'soft'}" title="Cover chosen by the customer">${c === 'hard' ? 'HARDCOVER' : 'SOFTCOVER'}</span>`;
// v1.28 — links between an original book and its duplicates / re-orders
function familyLine(d) {
  const f = d.family || [], o = d.order; if (!f.length) return '';
  const lbl = (x) => `<a href="#order/${x.id}">${esc(x.ref)}</a> ${cvBadge(x.cover)} ×${x.copies} <span class="pill s-${x.status}">${statusLabel(x.status)}</span>`;
  const parent = f.find(x => x.id === o.parent_id), kids = f.filter(x => x.id !== o.parent_id);
  return `<div class="small" style="margin:4px 0">${parent ? `${o.origin === 'reorder' ? 'More copies of' : 'Duplicate of'} ${lbl(parent)}` : ''}${parent && kids.length ? ' · ' : ''}${kids.length ? `${parent ? 'Also' : 'Copies'}: ${kids.map(lbl).join(' · ')}` : ''}</div>`;
}
function coverOptions(sel) { return Object.entries(META.covers || { soft: 'Softcover', hard: 'Hardcover' }).map(([k, l]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${l}${k === 'hard' ? ` (+$${META.hardSurcharge || 20})` : ''}</option>`).join(''); }

/* ---------- orders list ---------- */
let filter = '';
async function viewOrders() {
  const v = $('#view');
  v.innerHTML = `<div class="top"><div><div class="eyebrow">Production</div><h1>Orders</h1></div><button class="btn primary" id="new-order">+ New order</button></div>
    <div class="pipe" id="pipe"></div><div class="card scroll" id="list"><div class="empty">Loading…</div></div>`;
  $('#new-order').onclick = newOrder;
  const [dash, list] = await Promise.all([api('dashboard'), api('orders', { query: filter ? 'status=' + filter : '' })]);
  const counts = Object.fromEntries(dash.counts.map(c => [c.status, c.n])); const total = dash.counts.reduce((a, c) => a + c.n, 0);
  $('#pipe').innerHTML = `<button data-s="" class="${filter ? '' : 'on'}">All <b>${total}</b></button>` + META.statuses.map(([k, l]) => `<button data-s="${k}" class="${filter === k ? 'on' : ''}">${l} <b>${counts[k] || 0}</b></button>`).join('');
  $('#pipe').onclick = e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.s; viewOrders(); };
  const rows = list.orders;
  $('#list').innerHTML = rows.length ? `<table class="tbl"><thead><tr><th>Ref</th><th>Customer</th><th>Package</th><th>Cover</th><th class="num">Copies</th><th class="num">Price</th><th>Paid</th><th class="num">Photos</th><th>Status</th><th>Updated</th></tr></thead><tbody>${rows.map(o => `
    <tr class="click" data-id="${o.id}"><td class="mono">${esc(o.ref)}</td><td><b>${esc(o.customer_name)}</b><div class="small muted">${esc(o.customer_email)}</div></td>
    <td>${esc(META.packages[o.package]?.label || o.package)}</td><td>${cvBadge(o.cover)}</td><td class="num">${o.copies}</td><td class="num">${money(o.price_usd)}</td>
    <td class="small">${o.deposit_paid ? 'Deposit ✓' : '<span class="muted">Deposit —</span>'}<br>${o.balance_paid ? 'Balance ✓' : '<span class="muted">Balance —</span>'}</td>
    <td class="num">${o.photo_count}</td><td><span class="pill s-${o.status}">${statusLabel(o.status)}</span></td><td class="small muted">${when(o.updated_at)}</td></tr>`).join('')}</tbody></table>`
    : `<div class="empty">No orders${filter ? ' with this status' : ' yet'}. Create one with “New order”, or convert a website message.</div>`;
  $('#list').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) location.hash = 'order/' + tr.dataset.id; };
  refreshUnread();
}
function newOrder() {
  openDialog(`<h2>New order</h2><div class="grid2"><label>Customer name<input name="customer_name" required></label><label>Email<input name="customer_email" type="email" required></label></div>
    <div class="grid3"><label>Package<select name="package">${pkgOptions('signature')}</select></label><label>Cover<select name="cover">${coverOptions('soft')}</select></label><label>Copies<input name="copies" type="number" min="1" max="50" value="1"></label></div>
    <div class="grid2"><label>Phone<input name="phone"></label><label>Customer language<select name="lang"><option>en</option><option>fr</option><option>es</option><option>pt</option><option>it</option></select></label></div>
    <label>Notes<textarea name="notes"></textarea></label>`, async f => {
    const r = await post('order-create', Object.fromEntries(f)); toast('Order created'); location.hash = 'order/' + r.id;
  });
}

/* ---------- order sheet ---------- */
async function viewOrder(id) {
  const v = $('#view'); v.innerHTML = '<div class="empty">Loading…</div>';
  let d; try { d = await api('order', { query: 'id=' + id }); } catch (e) { v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const o = d.order, pf = o.profile || {}, pkg = META.packages[o.package] || {};
  const kept = d.photos.filter(p => p.keep !== false).length;
  v.innerHTML = `
  <div class="top"><div><div class="eyebrow"><a href="#orders">Orders</a> / ${esc(o.ref)}</div><h1>${esc(o.customer_name || 'Untitled')}</h1>
    ${familyLine(d)}

function luluCard(d) {
  const o = d.order, L = META.lulu || {}, approved = d.proofs.find(p => p.status === 'approved');
  const live = L.env === 'production', job = o.printer_order_id && /^Lulu/.test(o.printer || '');
  const lvl = o.ship_level || 'MAIL';
  const proofCover = approved?.layout?.binding || o.cover, mismatch = approved && proofCover !== o.cover;
  return `<section class="card stack" id="lulu">
    <div class="row" style="justify-content:space-between"><h2>Print with Lulu</h2>${L.configured ? `<span class="pill ${live ? 's-approved' : 's-proof_sent'}">${live ? 'LIVE — real printing' : 'SANDBOX — test, nothing printed'}</span>` : '<span class="pill">not connected</span>'}</div>
    ${!L.configured ? '<div class="small muted">Add <b>LULU_CLIENT_KEY</b>, <b>LULU_CLIENT_SECRET</b> and <b>LULU_ENV</b> (sandbox or production) in Vercel → Settings → Environment Variables, then redeploy.</div>' : `
    ${approved && !o.balance_paid ? `<div class="warnbox">Waiting for the customer to pay the balance: <b>${money(d.balanceDue)}</b>. “Send to Lulu” unlocks when it’s paid (or tick “Balance paid” for another payment method).</div>` : ''}
    ${approved && o.balance_paid && !job ? `<div class="small" style="color:var(--good)"><b>Approved & paid — ready to print.</b></div>` : ''}
    <div class="row"><span class="small">Customer chose</span> ${cvBadge(o.cover)} ${approved ? (mismatch ? `<span class="pill s-changes">✗ proof v${approved.version} was built for ${proofCover === 'hard' ? 'hardcover' : 'softcover'}: build a new proof</span>` : `<span class="pill s-approved">✓ approved proof and Lulu product match</span>`) : ''}</div>
    <div class="small muted">${approved ? `Prints the <b>approved proof v${approved.version}</b> (${approved.page_count} pages, ${esc(proofCover === 'hard' ? 'hardcover' : 'softcover')}) · ${o.copies} cop${o.copies > 1 ? 'ies' : 'y'} · ships to ${esc([o.ship_city, o.ship_country].filter(Boolean).join(', ') || 'no address yet')}` : 'Waiting for the customer to approve a proof.'}</div>
    <div class="row"><label style="min-width:220px">Shipping<select id="lulu-level">${(L.levels || ['MAIL']).map(l => `<option ${l === lvl ? 'selected' : ''} value="${l}">${l.replace('_', ' ').toLowerCase()}</option>`).join('')}</select></label></div>
    <div class="row"><button class="btn" type="button" id="lulu-quote" ${approved ? '' : 'disabled'}>Get Lulu price</button>
      <button class="btn primary" type="button" id="lulu-send" ${approved && !mismatch && o.balance_paid && (!job || ['CANCELED', 'REJECTED', 'ERROR'].includes(o.printer_status)) ? '' : 'disabled'}>Send to Lulu</button>
      ${job ? `<button class="btn" type="button" id="lulu-refresh">Refresh status</button>${['CREATED', 'UNPAID'].includes(o.printer_status) ? '<button class="btn ghost" type="button" id="lulu-cancel">Cancel job</button>' : ''}` : ''}</div>`}
    ${job ? `<dl class="kv"><dt>Print job</dt><dd>${esc(o.printer_order_id)} <span class="muted small">(${esc(o.printer_env || '')})</span></dd><dt>Lulu status</dt><dd><b>${esc(o.printer_status || '—')}</b></dd>
      <dt>Lulu cost</dt><dd>${esc(o.printer_cost || '—')}</dd><dt>Lulu promo</dt><dd>${o.lulu_promo_checked_at ? (o.lulu_promo ? `<b>${esc(o.lulu_promo)}</b>` : 'checked — none available') : '<span class="muted">not checked</span>'}</dd><dt>Tracking</dt><dd>${esc(o.tracking || '—')}</dd></dl>
      ${['REJECTED', 'ERROR'].includes(o.printer_status) ? `<div class="warnbox"><b>Lulu rejected the files.</b> The reason is in the Timeline below. Once fixed, click “Send to Lulu” again: a new print job is created (the approved proof stays approved).</div>` : ''}
      ${o.printer_status === 'UNPAID' ? `<div class="warnbox">Lulu is waiting for payment. Open <a href="https://developers${o.printer_env === 'production' ? '' : '.sandbox'}.lulu.com/print-jobs" target="_blank" rel="noopener">Lulu → Print Jobs</a> and pay job ${esc(o.printer_order_id)}${o.printer_env === 'production' ? '' : ' with a test card'}.${o.lulu_promo ? ` <b>Apply promo code ${esc(o.lulu_promo)} before paying.</b>` : ''}</div>` : ''}` : ''}
    <div id="lulu-out"></div>
  </section>`;
}
function bindLulu(id, reload, d0) {
  const out = (h) => { const el = $('#lulu-out'); if (el) el.innerHTML = h; };
  const lvl = () => $('#lulu-level')?.value || 'MAIL';
  const go = async (btn, action, extra, ok) => { const b = $(btn); if (!b) return; b.onclick = async () => {
    b.disabled = true; out('<div class="small muted">Talking to Lulu…</div>');
    try { const r = await post(action, { id, level: lvl(), ...(extra ? extra() : {}) }); ok(r); } catch (e) { out(`<div class="warnbox">${esc(e.message)}</div>`); b.disabled = false; } }; };
  go('#lulu-quote', 'printer-quote', null, r => { out(`<div class="small"><b>Lulu price (${esc(r.env)}):</b> ${esc(r.text)}</div>`); $('#lulu-quote').disabled = false; });
  const sendBtn = $('#lulu-send');
  if (sendBtn) sendBtn.onclick = () => { const o0 = d0.order, promo = META.luluPromo || ''; openDialog(`<h2>Send to Lulu?</h2><p>${META.lulu?.env === 'production' ? '<b>This is the LIVE account: the book will be printed and shipped, and Lulu will charge your card.</b>' : 'Sandbox: a test print job is created. Nothing is printed or charged.'}</p>
    <dl class="kv"><dt>Cover</dt><dd>${cvBadge(o0.cover)} <span class="small muted">Lulu product ${o0.cover === 'hard' ? 'case wrap' : 'perfect bound'}</span></dd><dt>Copies</dt><dd>${o0.copies}</dd><dt>Shipping</dt><dd><b>${esc(lvl())}</b></dd></dl>
    ${META.stripe?.configured && !o0.balance_paid ? '<div class="warnbox">The customer has not paid the balance yet.</div>' : ''}
    <div class="note" style="background:var(--warn-soft);padding:10px 12px;border-radius:8px"><b>Before you pay Lulu: check for a promo code.</b> Lulu’s API has no promo field; promotions are applied when you pay the job in the Lulu dashboard.
      <div class="small" style="margin-top:4px">Current promo saved in admin: <b>${promo ? esc(promo) : 'none'}</b> · <a href="https://www.lulu.com/" target="_blank" rel="noopener">Check Lulu promotions ↗</a></div>
      <label style="margin-top:8px">Promo code I will apply (leave empty if none)<input name="promo" value="${esc(promo)}" placeholder="e.g. LULU15"></label>
      <label style="display:flex;flex-direction:row;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" name="promoChecked" required style="width:auto;margin:0"> I checked Lulu promotions for this order</label></div>`, async f => {
    const r = await post('printer-send', { id, level: lvl(), promoChecked: f.get('promoChecked') === 'on', promo: f.get('promo') || '' }); toast(`Lulu print job ${r.jobId} created — ${r.cover === 'hard' ? 'hardcover' : 'softcover'}${r.promo ? ' · apply promo ' + r.promo + ' when you pay' : ''}`); reload(); }, 'Send to Lulu'); };
  go('#lulu-refresh', 'printer-refresh', null, r => { toast('Lulu status: ' + r.status); reload(); });
  const c = $('#lulu-cancel');
  if (c) c.onclick = () => openDialog('<h2>Cancel the Lulu print job?</h2><p>Only possible before it is paid.</p>', async () => { await post('printer-cancel', { id }); toast('Print job cancelled'); reload(); }, 'Cancel the job');
}
function confirmTracking(o) { return true; }

/* ---------- messages ---------- */
async function viewMessages() {
  const v = $('#view');
  v.innerHTML = `<div class="top"><div><div class="eyebrow">Website</div><h1>Messages</h1></div><label class="chk"><input type="checkbox" id="show-arch"> Show archived</label></div><div class="card scroll" id="mlist"><div class="empty">Loading…</div></div>`;
  const load = async () => {
    const r = await api('messages', { query: $('#show-arch').checked ? 'all=1' : '' });
    $('#mlist').innerHTML = r.messages.length ? `<table class="tbl"><thead><tr><th>Received</th><th>From</th><th>Type</th><th>Message</th><th></th></tr></thead><tbody>${r.messages.map(m => `
      <tr><td class="small muted">${when(m.created_at)}${m.status === 'new' ? '<br><span class="pill s-new">New</span>' : ''}</td>
      <td><b>${esc(m.name)}</b><div class="small"><a href="mailto:${esc(m.email)}">${esc(m.email)}</a></div><div class="small muted">${esc(m.discipline || '')} · ${esc(m.lang || '')}</div></td>
      <td>${esc(m.type)}<div class="small muted">${esc(m.package || '')}</div></td><td class="msg-body">${esc(m.message) || '<span class="muted">—</span>'}</td>
      <td><div class="row" style="justify-content:flex-end">${m.order_id ? `<a class="btn small" href="#order/${m.order_id}">Open order</a>` : `<button class="btn primary small" data-conv="${m.id}">Convert to order</button>`}
      ${m.status === 'new' ? `<button class="btn small" data-st="read" data-id="${m.id}">Mark read</button>` : ''}${m.status !== 'archived' ? `<button class="btn ghost small" data-st="archived" data-id="${m.id}">Archive</button>` : ''}</div></td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">No messages. Questions sent from the website’s contact form appear here.</div>';
  };
  $('#show-arch').onchange = load;
  $('#mlist').onclick = async e => {
    const t = e.target;
    if (t.dataset.conv) { const r = await post('message-convert', { id: +t.dataset.conv }); toast('Order created'); location.hash = 'order/' + r.id; }
    else if (t.dataset.st) { await post('message-update', { id: +t.dataset.id, status: t.dataset.st }); load(); refreshUnread(); }
  };
  load();
}

/* ---------- team ---------- */
async function viewTeam() {
  const v = $('#view');
  const r = await api('admins');
  v.innerHTML = `<div class="top"><div><div class="eyebrow">Access</div><h1>Team</h1></div><button class="btn primary" id="add-admin">+ Add admin</button></div>
    <div class="card scroll"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Since</th><th></th></tr></thead><tbody>${r.admins.map(a => `<tr><td>${esc(a.name || '—')}</td><td>${esc(a.email)}</td><td class="small muted">${when(a.created_at)}</td>
    <td class="num">${a.id === META.admin.id ? '<span class="small muted">You</span>' : `<button class="btn ghost small danger" data-rm="${a.id}">Remove</button>`}</td></tr>`).join('')}</tbody></table></div>
    <div class="card stack" style="max-width:520px;margin-top:16px"><h2>Lulu promo code</h2><p class="small muted">If Lulu runs a promotion, save the code here: it is shown on every “Send to Lulu” so you apply it when you pay the print job in the Lulu dashboard. Clear it when it expires.</p>
      <div class="row"><input id="lp" value="${esc(META.luluPromo || '')}" placeholder="No current promo" style="flex:1"><button class="btn" id="lp-save">Save</button></div></div>
    <div class="card stack" style="max-width:420px;margin-top:16px"><h2>Change my password</h2><label>New password<input type="password" id="np" minlength="8"></label><button class="btn" id="chg">Update password</button></div>`;
  $('#add-admin').onclick = () => openDialog(`<h2>Add an admin</h2><p class="small muted">Give them the email and temporary password; they can change it under Team.</p>
    <div class="grid2"><label>Name<input name="name"></label><label>Email<input name="email" type="email" required></label></div><label>Temporary password<input name="password" required minlength="8"></label>`,
    async f => { await post('admin-add', Object.fromEntries(f)); toast('Admin added'); viewTeam(); });
  v.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => openDialog('<h2>Remove this admin?</h2><p>They will no longer be able to sign in.</p>', async () => { await post('admin-remove', { id: +b.dataset.rm }); viewTeam(); }));
  $('#lp-save').onclick = async () => { try { const r = await post('settings-save', { lulu_promo: $('#lp').value }); META.luluPromo = r.luluPromo; toast(r.luluPromo ? 'Lulu promo saved: ' + r.luluPromo : 'Lulu promo cleared'); } catch (e) { toast(e.message); } };
  $('#chg').onclick = async () => { try { await post('password', { password: $('#np').value }); toast('Password updated'); $('#np').value = ''; } catch (e) { toast(e.message); } };
}

start();
</script>
