<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>My BOOKD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2315161B'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-style='italic' text-anchor='middle' fill='%23FF5A7E'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
window.onerror = function (m, s, l) { console.error('Portal error:', m, s, l); return false; };
window.onunhandledrejection = function (e) { console.error('Portal promise:', e.reason); };
</script>
<style>
/* Layout: a calm, guided workspace — four numbered steps (they are a real sequence), one card per step, photo grids per shoot, and the proof as page spreads. */
:root{--bg:#F4F5F7;--surface:#FFFFFF;--ink:#15161B;--muted:#5B5E68;--rule:#E1E3E8;--accent:#B0123B;--accent-soft:rgba(176,18,59,.08);--on-accent:#fff;--warn:#A15C00;--warn-soft:rgba(161,92,0,.1);--good:#1F7A4D;--good-soft:rgba(31,122,77,.1);
--page:#FBFBFA;--page-ink:#17181C;--page-muted:#6A6C73;
--display:"Bodoni Moda",Georgia,serif;--body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101115;--surface:#191B21;--ink:#ECEDF1;--muted:#A3A6B0;--rule:#2B2E37;--accent:#FF5A7E;--accent-soft:rgba(255,90,126,.12);--on-accent:#1A0710;--warn:#F0B35A;--warn-soft:rgba(240,179,90,.12);--good:#4FCB8C;--good-soft:rgba(79,203,140,.12);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.mark{font-family:var(--display);font-size:1.5rem;font-weight:600;letter-spacing:.06em}.mark i{color:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.15}
h1{font-size:clamp(1.8rem,4vw,2.5rem)}h2{font-size:1.4rem}h3{font-size:1.1rem}
.muted{color:var(--muted)}.small{font-size:.84rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}
.steps a{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--muted);display:grid;gap:2px}
.steps a b{font-family:var(--mono);font-size:.78rem;color:var(--accent);font-weight:500}
.steps a.on{border-color:var(--ink);color:var(--ink)}
.steps a.done b::after{content:" ✓";color:var(--good)}
@media (max-width:640px){.steps{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px;display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;color:var(--ink)}
label.chk input{width:auto;margin-top:4px}
input,select,textarea{background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:90px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.92rem}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.9rem}
.ok{background:var(--good-soft);color:var(--good);border-radius:8px;padding:10px 12px;font-size:.92rem}
.shoot{border:1px solid var(--rule);border-radius:10px;padding:14px;display:grid;gap:12px}
.credits{display:grid;gap:8px}
.cr{display:grid;grid-template-columns:150px 1fr auto;gap:8px}
@media (max-width:640px){.cr{grid-template-columns:1fr 1fr auto}}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th{position:relative;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--rule)}
.th img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.th .tag{position:absolute;left:5px;top:5px;font-family:var(--mono);font-size:.62rem;padding:2px 6px;border-radius:4px;background:var(--warn);color:#fff}
.th .tag.cv{left:auto;right:5px;background:var(--accent)}
.th .ops{display:flex;justify-content:space-between;align-items:center;padding:4px;gap:2px}
.th .ops button{background:none;border:0;color:var(--ink);font-size:.82rem;font-weight:600;cursor:pointer;padding:5px 7px;border-radius:6px}
.th .ops button:hover{background:var(--rule)}
.th .ops button:disabled{opacity:.3;cursor:default}
.th .ops .cvb{color:var(--accent)}
.th.is-cover{outline:3px solid var(--accent);outline-offset:-3px}
.quota{border-radius:10px;padding:12px 16px;display:grid;gap:8px}
.quota.ok{background:var(--bg)}.quota.full{background:var(--warn-soft);color:var(--warn)}.quota.over{background:#FBEBEB;color:#A1182F}
.quota .bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.quota .bar i{display:block;height:100%;background:currentColor;opacity:.75}
.quota.ok .bar i{background:var(--accent)}
.guide{background:var(--bg);border-radius:10px;padding:12px 16px;font-size:.9rem}
.guide ol{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.coverbox{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 14px}
.coverbox .cv{width:72px;aspect-ratio:4/5;border-radius:6px;background:var(--rule) center/cover no-repeat;flex:none}
.shoot-order{display:flex;gap:6px}
.th.up{display:grid;place-items:center;font-size:.8rem;color:var(--muted);text-align:center;padding:8px}
.drop{border:1.5px dashed var(--rule);border-radius:10px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
/* proof spreads */
.spread{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 auto 22px;max-width:760px}
.spread > .pg{box-shadow:0 20px 50px -30px rgba(0,0,0,.5)}
.pg{aspect-ratio:8.5/11;background:var(--page);color:var(--page-ink);container-type:inline-size;position:relative;overflow:hidden;cursor:pointer}
.pg.sel{outline:3px solid var(--accent);outline-offset:-3px}
.pg .in{position:absolute;inset:8cqw;display:flex;flex-direction:column}
.pg img.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pg img.framed{position:absolute;inset:10cqw 10cqw 14cqw;width:80cqw;height:calc(100% - 24cqw);object-fit:contain}
.pg .duo{position:absolute;left:8.8cqw;right:8.8cqw;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:1fr 1fr;gap:2.9cqw}
.pg .duo img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.pg .fol{position:absolute;bottom:3cqw;font-family:var(--mono);font-size:2.4cqw;color:var(--page-muted)}
.pg .fol.l{left:5cqw}.pg .fol.r{right:5cqw}
.pg .lr{position:absolute;top:3cqw;left:3cqw;font-family:var(--mono);font-size:2.4cqw;background:var(--warn);color:#fff;padding:.5cqw 1.5cqw;border-radius:1cqw}
.pg .cnt{position:absolute;top:3cqw;right:3cqw;font-family:var(--mono);font-size:2.4cqw;background:var(--accent);color:#fff;padding:.5cqw 1.5cqw;border-radius:5cqw}
.pg .num{font-family:var(--display);font-style:italic;font-size:20cqw;line-height:.8;color:var(--accent)}
.pg .kind{font-family:var(--mono);font-size:2.4cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--page-muted);margin-top:4cqw}
.pg .ttl{font-family:var(--display);font-size:6.5cqw;line-height:1.05;margin-top:1.5cqw}
.pg dl{display:grid;grid-template-columns:auto 1fr;gap:1.2cqw 4cqw;margin:5cqw 0 0;font-size:2.9cqw}
.pg dt{font-family:var(--mono);font-size:2.3cqw;letter-spacing:.12em;color:var(--page-muted);text-transform:uppercase;padding-top:.4cqw}
.pg dd{margin:0}
.pg .story{margin-top:auto;border-top:.3cqw solid var(--page-ink);padding-top:3cqw;font-family:var(--display);font-style:italic;font-size:3.6cqw;line-height:1.35}
.pg .bio{font-size:3.1cqw;margin-top:4cqw}
.pg.blank{background:repeating-linear-gradient(45deg,#E9E4DA 0 10px,#E2DCD0 10px 20px)}
.pg.closing .in{align-items:center;justify-content:center;text-align:center;gap:3cqw}
.cover-prev{max-width:260px}
.pg .cimg{margin-top:3cqw;display:block}
.pg .cimg.portrait{width:11.2cqw;height:11.2cqw;border-radius:50%;object-fit:cover}
.pg .cimg.logo{max-width:18.8cqw;max-height:9.4cqw;object-fit:contain}
.credimg{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.credimg img{width:56px;height:56px;object-fit:contain;border-radius:8px;background:var(--bg)}
.credimg img.portrait{border-radius:50%;object-fit:cover}
.pg .orn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pg .in{z-index:1}
/* book designs (templates) */
.tpl-sans .pg .ttl,.tpl-sans .pg .num,.tpl-sans .pg .story{font-family:var(--sans,system-ui,sans-serif)}
.tpl-sans .pg .num,.tpl-sans .pg .ttl{font-style:normal;font-weight:700}
.tpl-sans .pg .story{font-style:italic}
.tpl-upper .pg .ttl{text-transform:uppercase;letter-spacing:.02em}
.tpl-thin .pg .num{font-size:4.5cqw;font-weight:400;font-style:normal;line-height:1}
.tpl-thin .pg .ttl{font-weight:400;font-size:5cqw}
.tpl-thin .pg .story{border-top-width:.15cqw;width:auto}
.comments{display:grid;gap:8px}
.cm{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:.9rem}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50}
.center{min-height:70vh;display:grid;place-items:center;text-align:center}
</style>
</head>
<body>
<div id="toast" hidden></div>
<div class="wrap">
  <header class="top"><span class="mark">BOOK<i>D</i></span><span class="small muted" id="ref"></span></header>
  <div id="root"><div class="center muted">Loading your book…</div></div>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const T = new URLSearchParams(location.search).get('t') || '';
const PAID = new URLSearchParams(location.search).get('paid') || '';
const usd = v => '$' + Number(v || 0).toFixed(2) + ' USD';
let D = null, step = 'about', selPage = null;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
async function api(action, body, opts = {}) {
  const r = await fetch(`/api/portal/${action}?t=${encodeURIComponent(T)}${opts.query || ''}`, { method: body || opts.raw ? 'POST' : 'GET', headers: opts.headers || { 'Content-Type': 'application/json' }, body: opts.raw || (body ? JSON.stringify(body) : undefined) });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok || j.ok === false) throw new Error(j.error || 'Something went wrong (' + r.status + ')');
  return j;
}
async function load() {
  try { D = await api('get'); } catch (e) { $('#root').innerHTML = `<div class="center"><div><h2>We can’t open this book</h2><p class="muted">${esc(e.message)}</p></div></div>`; return; }
  $('#ref').textContent = `${D.order.ref} · ${D.order.packageLabel} · up to ${D.order.maxPhotos} photos`;
  if ((location.hash === '#proof' || PAID === 'balance') && D.proof) step = 'proof';
  if (PAID === 'upgrade' || location.hash === '#shoots') step = 'shoots';
  render();
}
function stepsDone() {
  const pf = D.order.profile, sh = D.order.ship;
  return { about: !!(pf.name && pf.bio), ship: !!(sh.ship_address && sh.ship_country), shoots: D.photos.length > 0 && !!D.order.submitted_at, proof: D.proof?.status === 'approved' };
}
function render() {
  const done = stepsDone();
  const names = [['about', 'About you'], ['ship', 'Shipping'], ['shoots', 'Shoots & photos'], ['proof', 'Your proof']];
  $('#root').innerHTML = `
    <h1>${esc(D.order.profile.name || D.order.customer_name || 'Your book')}</h1>
    <p class="muted">Your BOOKD in four steps. Everything saves as you go, so you can come back to this page any time with the same link.</p>
    ${PAID === 'deposit' ? `<div class="ok">Payment received — your book is reserved. We also emailed you this private link so you can come back any time.</div>` : ''}
    ${PAID === 'balance' ? `<div class="ok">Balance received — thank you! Your book goes to print now.</div>` : ''}
    ${PAID === 'reorder' ? `<div class="ok">Thank you! Your extra copies are ordered. You will receive an email when they ship.</div>` : ''}
    ${reorderBox()}
    ${PAID === 'upgrade' ? `<div class="ok">Done — your book is now ${esc(D.order.packageLabel)} ${esc((D.order.coverLabel || '').toLowerCase())}: up to ${D.order.maxPhotos} photos. The difference is added to your balance.</div>` : ''}
    ${D.order.locked && PAID !== 'balance' ? (D.order.pay && D.order.pay.online && !D.order.pay.balance_paid && D.order.pay.due > 0 ? `<div class="ok">Your book is approved. Pay the balance in “Your proof” and we send it to print.</div>` : `<div class="ok">Your book is approved and in production. Thank you!</div>`) : ''}
    <nav class="steps">${names.map(([k, l], i) => `<a href="#${k}" data-step="${k}" class="${step === k ? 'on' : ''} ${done[k] ? 'done' : ''}"><b>0${i + 1}</b>${l}</a>`).join('')}</nav>
    <section id="pane"></section>`;
  $('.steps').onclick = e => { const a = e.target.closest('a[data-step]'); if (!a) return; e.preventDefault(); step = a.dataset.step; render(); };
  ({ about: paneAbout, ship: paneShip, shoots: paneShoots, proof: paneProof })[step]();
  bindReorder();
}
const dis = () => D.order.locked ? 'disabled' : '';

/* 01 about */
function paneAbout() {
  const p = D.order.profile;
  $('#pane').innerHTML = `<form class="card" id="f">
    <h2>About you</h2><p class="small muted">This becomes the first page of your book, facing your best smile.</p>
    <div class="grid2"><label>Name as printed in the book<input name="name" value="${esc(p.name || D.order.customer_name)}" ${dis()}></label><label>Discipline line (e.g. Model · Fashion and beauty)<input name="role" value="${esc(p.role)}" ${dis()}></label></div>
    <label>Short bio (2–3 sentences)<textarea name="bio" maxlength="1200" ${dis()}>${esc(p.bio)}</textarea></label>
    <div class="grid2"><label>Height (optional)<input name="height" value="${esc(p.height)}" ${dis()}></label><label>Languages<input name="languages" value="${esc(p.languages)}" ${dis()}></label></div>
    <div class="grid2"><label>Agency (optional)<input name="agency" value="${esc(p.agency)}" ${dis()}></label><label>Based in<input name="city" value="${esc(p.city)}" ${dis()}></label></div>
    <div class="grid2"><label>Contact line for the last page (email or agent)<input name="contact" value="${esc(p.contact)}" ${dis()}></label><label>Website or Instagram<input name="website" value="${esc(p.website)}" ${dis()}></label></div>
    <div class="row"><button class="btn primary" ${dis()}>Save and continue</button></div></form>`;
  $('#f').onsubmit = async e => { e.preventDefault(); await api('profile', { profile: Object.fromEntries(new FormData(e.target)) }); D.order.profile = { ...D.order.profile, ...Object.fromEntries(new FormData(e.target)) }; toast('Saved'); step = 'ship'; render(); };
}
/* 02 shipping */
function paneShip() {
  const s = D.order.ship;
  $('#pane').innerHTML = `<form class="card" id="f">
    <h2>Where should we ship your book?</h2>
    <div class="grid2"><label>Full name<input name="ship_name" value="${esc(s.ship_name)}" ${dis()}></label><label>Phone (for the courier)<input name="phone" type="tel" value="${esc(s.phone)}" required ${dis()}></label></div>
    <label>Street address<input name="ship_address" value="${esc(s.ship_address)}" ${dis()}></label>
    <div class="grid2"><label>City<input name="ship_city" value="${esc(s.ship_city)}" ${dis()}></label><label>State / province<input name="ship_region" value="${esc(s.ship_region)}" placeholder="e.g. QC, NY" ${dis()}></label></div>
    <div class="grid2"><label>Postal code<input name="ship_postal" value="${esc(s.ship_postal)}" ${dis()}></label><label>Country<input name="ship_country" value="${esc(s.ship_country)}" placeholder="e.g. Canada" ${dis()}></label></div>
    <div class="row"><button class="btn primary" ${dis()}>Save and continue</button></div></form>`;
  $('#f').onsubmit = async e => { e.preventDefault(); const ship = Object.fromEntries(new FormData(e.target)); await api('profile', { ship }); D.order.ship = { ...D.order.ship, ...ship }; toast('Saved'); step = 'shoots'; render(); };
}
/* 03 shoots */
const CREDIT_DEFAULTS = ['Photographer', 'Makeup', 'Hair', 'Styling', 'Location', 'Date'];
function upKey() { const P = D.order.packages || {}, up = nextPackage(); return Object.keys(P).find(k => P[k] === up) || ''; }
function nextPackage() {
  const P = D.order.packages || {}, cur = P[D.order.package] || {};
  return Object.entries(P).filter(([k, p]) => p.maxPhotos > (cur.maxPhotos || 0)).sort((a, b) => a[1].maxPhotos - b[1].maxPhotos).map(([k, p]) => p)[0] || null;
}
function quotaBox() {
  const n = D.photos.length, max = D.order.maxPhotos || 0, pct = Math.min(100, Math.round(n / Math.max(1, max) * 100)), up = nextPackage();
  const add = up?.upgrade ?? 0;
  const upTxt = up && !D.order.locked ? ` Or move up to <b>${esc(up.label)}</b>: up to ${up.maxPhotos} photos, ${up.pages} pages, ${esc((D.order.coverLabel || '').toLowerCase())}, for the price difference: <b>+$${add} USD</b>, added to your balance (nothing to pay now).<div class="row" style="margin-top:8px"><button class="btn primary" type="button" id="upgrade" data-to="${esc(upKey())}" data-add="${add}">Upgrade to ${esc(up.label)} · +$${add} USD</button></div>` : '';
  if (n > max) return `<div class="quota over"><b>${n} photos — your ${esc(D.order.packageLabel)} package includes ${max}.</b><div class="bar"><i style="width:100%"></i></div><div class="small">Please remove ${n - max} photo${n - max > 1 ? 's' : ''} (press ✕ under a photo).${upTxt}</div></div>`;
  if (n === max) return `<div class="quota full"><b>${n} of ${max} photos: your package is full.</b><div class="bar"><i style="width:100%"></i></div><div class="small">To add another photo, remove one first.${upTxt}</div></div>`;
  return `<div class="quota ok"><div><b>${n} of ${max} photos</b> <span class="small muted">· ${esc(D.order.packageLabel)} package · ${max - n} more you can add</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
// v1.28 — order more copies of the same book later (the design is already done: printing price only)
function reorderBox() {
  const R = D.order.reorder; if (!R) return '';
  return `<div class="card stack" id="reorder" style="margin:14px 0"><h2 style="margin:0">Order more copies</h2>
    <div class="small muted">The same book you approved — no new design. Pay online, we print and ship to <b>${esc(R.shipTo)}</b>. To ship somewhere else, write to us.</div>
    <div class="grid2"><label>Copies<input id="ro-n" type="number" min="1" max="50" value="1"></label>
      <label>Cover<select id="ro-cv"><option value="soft" ${D.order.cover === 'soft' ? 'selected' : ''}>Softcover · $${R.extra.soft} each</option><option value="hard" ${D.order.cover === 'hard' ? 'selected' : ''}>Hardcover · $${R.extra.hard} each</option></select></label></div>
    <div class="small" id="ro-sum"></div>
    <div class="row"><button class="btn primary" type="button" id="ro-go">Order and pay</button></div></div>`;
}
function bindReorder() {
  const R = D.order.reorder; if (!R || !$('#ro-go')) return;

async function uploadFiles(shoot, files, el) {

    <div class="row" style="justify-content:space-between"><h2>Your proof — version ${P.version}</h2><a class="btn ghost" href="${esc(P.preview_url || P.interior_url)}" target="_blank" rel="noopener">Download PDF (double pages) ↗</a></div>
    ${refreshBox(P)}
    ${P.status === 'approved' ? `<div class="ok">${D.order.pay && D.order.pay.online && !D.order.pay.balance_paid && D.order.pay.due > 0 ? 'You approved this proof. Pay the balance below and we send it to print.' : 'You approved this proof. We’re sending it to print.'}</div>${payBox()}` : P.status === 'changes' ? `<div class="warn">You asked for changes. We’ll send you a new version soon.</div>` : `<p class="muted">Flip through your book below. Tap a page to comment on it. When you’re happy, approve it at the bottom. Nothing is printed before you approve.</p>`}
    ${L.cover ? `<div><div class="eyebrow" style="margin-bottom:6px">Cover</div><div class="pg cover-prev" style="cursor:default"><img class="full" src="${esc(L.cover.url)}" alt=""><div class="in" style="justify-content:flex-end;color:#fff"><div class="ttl" style="font-size:10cqw">${esc(L.cover.name)}</div><div class="kind" style="color:#fff">${esc(L.cover.role)}</div></div></div></div>` : ''}
    <div id="spreads" class="${tplClass(L.theme)}" style="${tplVars(L.theme)}">${spreads.map(([a, b], i) => `<div class="spread">${a ? pageHtml(a, pages.indexOf(a)) : '<div aria-hidden="true"></div>'}${b ? pageHtml(b, pages.indexOf(b)) : '<div aria-hidden="true"></div>'}</div>`).join('')}</div>
    ${open ? `<div class="card" style="background:var(--bg)" id="cbox"><h3>${selPage ? 'Comment on page ' + selPage : 'General comment'}</h3><textarea id="ctext" placeholder="What should we change?"></textarea><div class="row"><button class="btn" id="csend">Add comment</button>${selPage ? '<button class="btn ghost" id="cgen">Make it a general comment</button>' : ''}</div></div>` : ''}
    ${D.comments.length ? `<div class="comments"><h3>Comments</h3>${D.comments.map(c => `<div class="cm">${c.page ? `<b>Page ${c.page}:</b> ` : ''}${esc(c.body)}</div>`).join('')}</div>` : ''}
    ${open ? `<div class="card" style="background:var(--bg)"><h3>Your decision</h3>
      ${flagged ? `<label class="chk"><input type="checkbox" id="acc"> I’ve seen the ${flagged} photo${flagged > 1 ? 's' : ''} marked TOO SMALL and I accept ${flagged > 1 ? 'them' : 'it'} as is.</label>` : ''}
      <label>Note (optional)<textarea id="dnote" style="min-height:60px"></textarea></label>
      <div class="row"><button class="btn primary" id="approve">Approve for print</button><button class="btn" id="changes">Ask for changes</button></div></div>` : ''}
  </div>`;
  $('#spreads').onclick = e => { const pg = e.target.closest('[data-page]'); if (!pg || !open) return; selPage = +pg.dataset.page === selPage ? null : +pg.dataset.page; paneProof(); $('#cbox')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  $('#refresh') && ($('#refresh').onclick = async () => { const b = $('#refresh'); b.disabled = true; b.textContent = 'Updating your book… (about 20 seconds)';
    try { const r = await api('proof-refresh', {}); toast(`Proof updated — version ${r.version}`); await load(); step = 'proof'; render(); } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Update my proof'; } });
  $('#paybal') && ($('#paybal').onclick = async () => { const b = $('#paybal'); b.disabled = true; b.textContent = 'Opening secure payment…';
    try { const r = await fetch(`/api/checkout?action=balance&t=${encodeURIComponent(T)}`, { method: 'POST' }); const j = await r.json(); if (!r.ok || !j.url) throw new Error(j.error || 'Payment unavailable'); location.href = j.url; } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Pay the balance'; } });
  if (!open) return;
  $('#csend').onclick = async () => { const b = $('#ctext').value.trim(); if (!b) return; await api('proof-comment', { proofId: P.id, page: selPage, body: b }); D.comments.push({ page: selPage, body: b }); toast('Comment added'); selPage = null; paneProof(); };
  $('#cgen') && ($('#cgen').onclick = () => { selPage = null; paneProof(); });
  const decide = async (decision) => {
    try { await api('proof-decide', { proofId: P.id, decision, note: $('#dnote').value, acceptFlagged: decision !== 'approve' || !flagged || $('#acc').checked });
      toast(decision === 'approve' ? 'Approved — thank you!' : 'Request sent'); await load(); step = 'proof'; render(); }
    catch (e) { toast(e.message); }
  };
  $('#approve').onclick = () => { if (flagged && !$('#acc').checked) { toast('Please tick the box about the low-res photos first'); return; } decide('approve'); };
  $('#changes').onclick = () => decide('changes');
}
window.addEventListener('hashchange', () => { if (location.hash === '#proof') load(); });
load();
</script>
</body>
</html>
